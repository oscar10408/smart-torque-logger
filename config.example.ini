; ATX Logger settings - copy to config.ini, edit, and restart the app
[atx]
host = 127.0.0.1
port = 5020          ; 5020 = local fake controller for the demo, 502 = real controller
unit_id = 1
framer = socket
headers1 = headers1.txt
headers2 = headers2.txt
tools = T1
org_code = DEMO_ORG
screwdriver_id = 1
write_raw = true
write_scans = false
screws_per_board = 12
torque_scale = 0.001
torque_decimals = 3
torque_columns = Target_Torque, Final_Torque, Final_Stage_Max_Torque, Final_Stage_Min_Torque, Max_Torque_Final_Stage, Min_Torque_Final_Stage, Max_Torque, Min_Torque, Final_and_Prevailing_Torque, Prevailing_Torque, Final+Prevailing_Torque, PreTighten, Clamp_Torque, Max_Clamp, Min_Clamp, Torque_Tool_Rating, Max_Tool_Rating
output_dir = ./Data
scanner_enabled = true
scanner_max_gap_ms = 50
scanner_min_length = 6
scanner_pattern = ABC.*
sn_max_age_min = 30

